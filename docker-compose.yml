version: '3.8'

services:
  trippilot:
    build: .
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WEATHER_API_KEY=${WEATHER_API_KEY}
    volumes:
      - trippilot_data:/app/server/data
    restart: unless-stopped

volumes:
  trippilot_data:

